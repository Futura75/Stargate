name: Supabase keep-alive
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/stargate_state?select=user_id&limit=1" -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -o /dev/null